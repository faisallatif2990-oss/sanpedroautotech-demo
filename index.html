<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="description" content="Demo website concept for San Pedro Automotive — auto repair in San Pedro, CA. Diagnostics, brakes, oil changes, suspension and general repair for foreign and domestic vehicles." />
<link rel="icon" href="data:," />
<title>San Pedro Automotive — Auto Repair in San Pedro, CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: light;
    --paper:#FAF6F1;
    --paper-2:#F2EDE6;
    --white:#ffffff;
    --navy:#0A1628;
    --navy-2:#122440;
    --red:#FF4D24;
    --red-dark:#C93A15;
    --red-soft:rgba(255,77,36,.10);
    --ink:#141B26;
    --ink-2:#4D5969;
    --ink-3:#7C8798;
    --on-navy:#C2CEDF;
    --line:rgba(10,22,40,.13);
    --line-soft:rgba(10,22,40,.07);
    --line-navy:rgba(255,255,255,.14);
    --field:#F7F3EE;
    --ok:#1F7A43;
    --ok-bg:#E4F3E9;
    --err:#B3261E;
    --err-bg:#FBEAE8;
    --focus:#C93A15;
    --shadow:0 16px 40px rgba(10,22,40,.12);
    --shadow-sm:0 6px 20px rgba(10,22,40,.08);
    --ease:cubic-bezier(0.22,1,0.36,1);
  }
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none !important;animation:none !important}
  }
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.55;font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-weight:800;line-height:1.08;margin:0;color:var(--navy)}
  p{margin:0}
  img{display:block;max-width:100%}
  a{color:var(--red-dark)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
  button,select,input,textarea{font:inherit;color:inherit}
  button,select,input:not([type="checkbox"]),textarea,a.btn{min-height:44px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative;z-index:2}
  .tnum{font-variant-numeric:tabular-nums}
  section[id]{scroll-margin-top:96px}

  /* Display type — the template's voice: bold, tight, italic grotesque */
  .display{
    font-weight:800;font-style:italic;text-transform:uppercase;
    letter-spacing:-.015em;line-height:1.02;color:var(--navy);
  }
  h1.display{font-size:clamp(42px,5.6vw,72px)}
  h2.display{font-size:clamp(32px,4vw,50px)}
  .display .red{color:var(--red)}
  .on-navy h2.display,.on-navy .display{color:#fff}
  .label{
    display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--red-dark);margin:0 0 16px;
  }
  .label::before{content:"";width:44px;height:2px;background:var(--red);flex:0 0 44px}
  .on-navy .label{color:#FF8A6B}
  .lede{color:var(--ink-2);font-size:17.5px;max-width:36em;margin-top:16px}
  .on-navy .lede{color:var(--on-navy)}
  .ghost{
    position:absolute;top:26px;right:-8px;z-index:0;pointer-events:none;user-select:none;
    font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.01em;
    font-size:clamp(72px,11vw,150px);line-height:1;color:transparent;
    -webkit-text-stroke:1.5px rgba(10,22,40,.10);
  }
  .on-navy .ghost{-webkit-text-stroke:1.5px rgba(255,255,255,.13)}

  /* Sections */
  .section{padding:96px 0;position:relative;overflow:hidden}
  .section.white{background:var(--white)}
  .section.navy{background:var(--navy)}
  .section-head{max-width:720px}
  .section-head.center{margin:0 auto;text-align:center}
  .section-head.center .label{justify-content:center}
  .section-head.center .label::after{content:"";width:44px;height:2px;background:var(--red);flex:0 0 44px}
  .section-head.center .lede{margin-left:auto;margin-right:auto}

  /* Top bar */
  .topbar{background:var(--navy);color:var(--on-navy);font-size:14px}
  .topbar-in{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-top:9px;padding-bottom:9px}
  .topbar a{color:#fff;text-decoration:none;font-weight:600;white-space:nowrap}
  .topbar a:hover{text-decoration:underline;text-underline-offset:3px}
  .topbar-meta{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
  .topbar-meta span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .topbar-meta svg{width:15px;height:15px;color:var(--red);flex:0 0 15px}
  .topbar-links{display:flex;gap:28px}

  /* Sticky white nav */
  header.site{
    background:var(--white);border-bottom:1px solid var(--line-soft);
    position:sticky;top:0;z-index:40;
    transition:box-shadow .25s var(--ease);
  }
  header.site.scrolled{box-shadow:0 8px 28px rgba(10,22,40,.10)}
  .header-in{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);min-height:44px}
  .brand-mark{
    width:46px;height:46px;flex:0 0 46px;border-radius:999px;background:var(--red);
    color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:24px;height:24px}
  .brand-name{font-weight:800;font-size:20px;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;display:block}
  .brand-sub{font-size:13px;color:var(--ink-2);line-height:1.25;display:block;font-weight:500}
  nav.main{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  nav.main a{
    color:var(--navy);text-decoration:none;font-weight:600;font-size:15.5px;padding:10px 13px;border-radius:999px;
    display:inline-flex;align-items:center;gap:7px;min-height:44px;
    transition:background-color .18s var(--ease),color .18s var(--ease);
  }
  nav.main a:hover,nav.main a:focus-visible,nav.main a:active,nav.main a.active{
    background:var(--red-soft);color:var(--red-dark);
  }
  .badge{
    background:var(--red);color:#fff;font-weight:700;font-size:12.5px;line-height:1;
    min-width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;
    font-variant-numeric:tabular-nums;
  }
  .badge[hidden]{display:none}
  a.btn.header-call{display:none}

  /* Buttons — full pills, template style */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--red);color:#fff;border:1.5px solid var(--red);
    font-weight:700;font-size:16px;text-decoration:none;padding:0 28px;min-height:52px;border-radius:999px;cursor:pointer;
    transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease);
  }
  .btn:hover{background:var(--red-dark);border-color:var(--red-dark)}
  .btn:active{transform:scale(.99)}
  .btn.secondary{background:var(--white);color:var(--navy);border-color:var(--navy)}
  .btn.secondary:hover{background:var(--navy);color:#fff}
  .btn.white{background:#fff;color:var(--red-dark);border-color:#fff}
  .btn.white:hover{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.ghost-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.75)}
  .btn.ghost-w:hover{background:#fff;color:var(--navy);border-color:#fff}
  .btn.small{min-height:44px;padding:0 20px;font-size:15px}
  .btn.call{white-space:nowrap}
  .btn[disabled]{opacity:.55;cursor:default}
  nav.main a.btn{color:#fff;padding:0 22px;min-height:48px}
  nav.main a.btn:hover,nav.main a.btn:focus-visible,nav.main a.btn:active{background:var(--red-dark);color:#fff}

  /* Hero — split: copy at the left, film in the collage frame at the right */
  .hero{background:var(--paper);padding:72px 0 88px;position:relative;overflow:hidden}
  .hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center}
  .hero .lede{font-size:18px}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
  .hero-stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
    margin-top:44px;padding-top:28px;border-top:1px solid var(--line);
  }
  .hero-stats .s-num{
    font-weight:800;font-style:italic;font-size:34px;line-height:1;color:var(--navy);letter-spacing:-.01em;
  }
  .hero-stats .s-num .red{color:var(--red)}
  .hero-stats .s-lab{color:var(--ink-2);font-size:14px;line-height:1.4;margin-top:6px}
  .hero-media{position:relative;padding:0 0 34px 0}
  .hero-media::before{
    content:"";position:absolute;top:-22px;right:-22px;width:180px;height:180px;
    background:var(--red);border-radius:24px;z-index:0;
  }
  .hero-frame{
    position:relative;z-index:1;border-radius:24px;overflow:hidden;background:var(--navy);
    box-shadow:var(--shadow);aspect-ratio:4/3.1;
  }
  .hero-frame img,.hero-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-frame video{opacity:0;transition:opacity .7s var(--ease)}
  .hero-frame video.ready{opacity:1}
  @media (prefers-reduced-motion: reduce){
    .hero-frame video{display:none}
  }
  .hero-photo-small{
    position:absolute;z-index:2;left:-30px;bottom:0;width:44%;
    border-radius:16px;overflow:hidden;border:6px solid var(--white);box-shadow:var(--shadow-sm);
    aspect-ratio:4/2.9;
  }
  .hero-photo-small img{width:100%;height:100%;object-fit:cover}
  .hero-card{
    position:absolute;z-index:3;right:-14px;bottom:52px;background:var(--white);
    border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;
    display:flex;gap:12px;align-items:center;max-width:290px;
  }
  .hero-card .hc-icon{
    width:42px;height:42px;flex:0 0 42px;border-radius:999px;background:var(--red-soft);color:var(--red-dark);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-card .hc-icon svg{width:22px;height:22px}
  .hero-card .hc-big{font-weight:700;font-size:15.5px;color:var(--navy);line-height:1.25}
  .hero-card .hc-small{color:var(--ink-2);font-size:13.5px;line-height:1.35}

  /* Red marquee strip */
  .marquee{background:var(--red);color:#fff;overflow:hidden;padding:15px 0}
  .marquee-track{display:flex;width:max-content;animation:marquee 30s linear infinite}
  .marquee:hover .marquee-track{animation-play-state:paused}
  .marquee-set{display:flex;align-items:center;gap:34px;padding-right:34px}
  .marquee-set span{
    font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em;
    font-size:16px;white-space:nowrap;
  }
  .marquee-set svg{width:19px;height:19px;flex:0 0 19px;opacity:.9}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* About */
  .about-grid{display:grid;grid-template-columns:.94fr 1.06fr;gap:56px;align-items:center}
  .about-photo{position:relative}
  .about-photo .ph{border-radius:24px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .about-photo .ph img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3.15}
  .about-badge{
    position:absolute;left:20px;bottom:20px;background:var(--white);border-radius:14px;
    box-shadow:var(--shadow);padding:13px 17px;display:flex;gap:12px;align-items:center;max-width:300px;
  }
  .about-badge .ab-icon{
    width:40px;height:40px;flex:0 0 40px;border-radius:999px;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .about-badge .ab-icon svg{width:21px;height:21px}
  .about-badge .ab-big{font-weight:700;font-size:15px;color:var(--navy);line-height:1.25}
  .about-badge .ab-small{color:var(--ink-2);font-size:13px;line-height:1.35}
  .check-grid{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
  .check-grid li{display:flex;gap:11px;color:var(--ink-2);font-size:15.5px;line-height:1.45}
  .check-grid li strong{color:var(--navy);font-weight:700;display:block;font-size:16px}
  .tick{
    color:#fff;background:var(--red);font-weight:700;flex:0 0 22px;width:22px;height:22px;
    border-radius:999px;font-size:13px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .about-cta{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:34px}
  .phone-cta{display:flex;gap:13px;align-items:center;text-decoration:none}
  .phone-cta .pc-icon{
    width:48px;height:48px;flex:0 0 48px;border-radius:999px;background:var(--red-soft);color:var(--red-dark);
    display:flex;align-items:center;justify-content:center;
  }
  .phone-cta .pc-icon svg{width:23px;height:23px}
  .phone-cta .pc-lab{font-size:13.5px;color:var(--ink-2);display:block;line-height:1.3}
  .phone-cta .pc-num{font-weight:800;font-size:19px;color:var(--navy);display:block;line-height:1.25;white-space:nowrap}
  .phone-cta:hover .pc-num{color:var(--red-dark)}

  /* Services — white cards on the navy band, hover turns the card red */
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px;position:relative;z-index:1}
  .svc-card{
    background:var(--white);border-radius:18px;padding:28px;
    transition:background-color .25s var(--ease);
  }
  .svc-icon{
    width:52px;height:52px;border-radius:14px;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;
    transition:background-color .25s var(--ease),color .25s var(--ease);
  }
  .svc-icon svg{width:26px;height:26px}
  .svc-card h3{font-size:20px;transition:color .25s var(--ease)}
  .svc-card p{color:var(--ink-2);font-size:15.5px;margin-top:7px;transition:color .25s var(--ease)}
  .svc-card .req-link{
    background:none;border:none;padding:10px 0 2px;min-height:44px;cursor:pointer;
    color:var(--red-dark);font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;gap:6px;
    transition:color .25s var(--ease);
  }
  .svc-card .req-link:hover{text-decoration:underline;text-underline-offset:3px}
  @media (hover:hover){
    .svc-card:hover{background:var(--red)}
    .svc-card:hover h3{color:#fff}
    .svc-card:hover p{color:rgba(255,255,255,.88)}
    .svc-card:hover .svc-icon{background:#fff;color:var(--red)}
    .svc-card:hover .req-link{color:#fff}
  }

  /* Why choose us — photo + floating card, accordion of true points */
  .why-grid{display:grid;grid-template-columns:.96fr 1.04fr;gap:56px;align-items:center}
  .why-photo{position:relative}
  .why-photo .ph{border-radius:24px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .why-photo .ph img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3.3}
  .why-card{
    position:absolute;right:20px;bottom:20px;background:var(--white);border-radius:14px;
    box-shadow:var(--shadow);padding:14px 18px;display:flex;gap:12px;align-items:center;max-width:280px;
  }
  .why-card .wc-icon{
    width:42px;height:42px;flex:0 0 42px;border-radius:999px;background:var(--red-soft);color:var(--red-dark);
    display:flex;align-items:center;justify-content:center;
  }
  .why-card .wc-icon svg{width:22px;height:22px}
  .why-card .wc-big{font-weight:800;font-style:italic;font-size:21px;color:var(--navy);line-height:1.1}
  .why-card .wc-small{color:var(--ink-2);font-size:13.5px;line-height:1.35}
  .accordion{margin-top:30px;display:grid;gap:12px}
  .accordion details{
    background:var(--white);border:1px solid var(--line-soft);border-radius:14px;
    box-shadow:0 2px 10px rgba(10,22,40,.04);
  }
  .accordion summary{
    cursor:pointer;padding:17px 20px;font-weight:700;font-size:16.5px;color:var(--navy);list-style:none;
    display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px;
  }
  .accordion summary::-webkit-details-marker{display:none}
  .accordion summary::after{
    content:"+";color:var(--red);font-size:23px;font-weight:600;line-height:1;flex:0 0 auto;
  }
  .accordion details[open ] summary::after{content:"–"}
  .accordion details p{color:var(--ink-2);padding:0 20px 19px;font-size:15.5px;max-width:36em}
</style>
</head>
